name: IndustrialAI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (non-model-dependent)
        env:
          DATABASE_URL: "sqlite:///./data/predictions.db"
          LLM_PROVIDER: "openrouter"
          OPENROUTER_API_KEY: ""
        run: |
          mkdir -p data/raw data/processed models reports
          pytest tests/test_data.py tests/test_model.py tests/test_rag.py -v \
            --tb=short -k "not skipif"

      - name: Run API tests
        env:
          DATABASE_URL: "sqlite:///./data/predictions.db"
          LLM_PROVIDER: "openrouter"
          OPENROUTER_API_KEY: ""
        run: |
          pytest tests/test_api.py -v --tb=short \
            -k "health or invalid or missing or maintenance"
